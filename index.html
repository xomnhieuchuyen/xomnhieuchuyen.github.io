<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trang truyện</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <a href="index.html" class="site-title">Trang truyện</a>
      <span class="site-tagline">chữ, giọng đọc, và đôi khi cả hình ảnh</span>
    </header>

    <main id="toc"></main>
  </div>

  <script src="stories.js"></script>
  <script>
    const toc = document.getElementById('toc');

    if (!STORIES.length) {
      toc.innerHTML = '<p class="empty-note">Chưa có truyện nào được đăng.</p>';
    } else {
      // Hiển thị truyện mới nhất lên đầu (truyện thêm sau cùng trong stories.js sẽ hiện trên)
      STORIES.slice().reverse().forEach((story, i) => {
        const num = String(STORIES.length - i).padStart(2, '0');
        const a = document.createElement('a');
        a.className = 'toc-item';
        a.href = `story.html?s=${encodeURIComponent(story.slug)}`;
        a.innerHTML = `
          <span class="toc-num">${num}</span>
          <div class="toc-body">
            <h2>${story.title}</h2>
            <p class="toc-meta">${story.date}</p>
            <p class="toc-excerpt">${story.excerpt || ''}</p>
          </div>`;
        toc.appendChild(a);
      });
    }
  </script>
</body>
</html>
