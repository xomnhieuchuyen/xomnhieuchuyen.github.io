<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Đang tải truyện…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <a href="index.html" class="site-title">Trang truyện</a>
      <span class="site-tagline">chữ, giọng đọc, và đôi khi cả hình ảnh</span>
    </header>

    <main id="content">
      <p class="empty-note">Đang tải truyện…</p>
    </main>
  </div>

  <script src="stories.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('s');
    const story = STORIES.find(s => s.slug === slug);
    const content = document.getElementById('content');

    if (!story) {
      content.innerHTML = `
        <a class="back-link" href="index.html">← Về danh mục</a>
        <p class="empty-note">Không tìm thấy truyện này. Có thể đường dẫn đã sai hoặc truyện đã bị gỡ.</p>`;
    } else {
      document.getElementById('page-title').textContent = story.title;

      let html = `<a class="back-link" href="index.html">← Về danh mục</a>`;
      html += `<h1 class="story-title">${story.title}</h1>`;
      html += `<p class="story-meta">${story.date}</p>`;
      html += `<div class="story-text">`;
      story.paragraphs.forEach(p => { html += `<p>${p}</p>`; });
      html += `</div>`;

      if (story.audio) {
        html += `
          <div class="media-section">
            <p class="media-label">Nghe truyện</p>
            <audio controls src="${story.audio}"></audio>
          </div>`;
      }

      if (story.youtube) {
        html += `
          <div class="media-section">
            <p class="media-label">Xem thêm</p>
            <div class="video-frame">
              <iframe src="https://www.youtube.com/embed/${story.youtube}"
                title="${story.title}" allowfullscreen></iframe>
            </div>
          </div>`;
      }

      content.innerHTML = html;
    }
  </script>
</body>
</html>
